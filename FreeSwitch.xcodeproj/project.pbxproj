				"IDENT=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"",
				"codesign --force $TS --options runtime --identifier com.freeswitch.FreeSwitch.helper --sign \"$IDENT\" \"$HELPER_OUT\"",
				"cp \"$PLIST\" \"$DAEMON_DIR/com.freeswitch.FreeSwitch.helper.plist\"",
				"echo \"Embedded FreeSwitchHelper + LaunchDaemon plist\"",
